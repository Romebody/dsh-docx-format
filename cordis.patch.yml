# dsh-docx-format —— 公文格式规范化
# 安装方式（把 <PLUGIN_DIR> 换成插件所在目录）：
#   1) profile 的 package.json dependencies 加 "dsh-docx-format": "link:<PLUGIN_DIR>"
#      （已发布到 npm 时直接写版本号，如 "dsh-docx-format": "^1.0.0"）
#   2) dsh.profile.bundles 追加 "dsh-docx-format"
#   3) 重启 dsh
- insert:
    - id: docx-format
      name: 'dsh-docx-format'
      config:
        # 自动规范化：任何工具结果里出现 .docx 路径都会排队处理
        autoFormat: true
        # 只处理插件加载之后新写的文件；true 则连旧文件一起改（有备份需求时改这个）
        formatExisting: false
        debounceMs: 1200
        timeoutMs: 120000
        # 显式指定 python；留空则自动找 .dsh 自带运行时
        python: ''
        skipPatterns:
          - '*格式要求*'
          - '*模板*'
          - '~$*'
          - '*/node_modules/*'
        # 触发词：会话最后一条用户消息含其中之一 → 套完整公文版式
        # 例：用户说“按公文格式写份通知” → 生效；只说“写份周报” → 只做全局规范化
        # 置成空数组 [] 表示任何请求都套完整版式
        triggerKeywords:
          - '公文'
        # 没命中触发词时仍做全局规范化：分页六项全关、中文引号换“”、中文里英文前后不留空格
        # 置成 false 则彻底不碰文件（旧行为）
        globalNormalize: true
        # 字体档：false = 普通档（方正小标宋简体/仿宋/黑体/楷体）
        #         true  = 一律严格档（方正小标宋_GBK/仿宋_GB2312/方正黑体_GBK/楷体_GB2312）
        strictFonts: false
        # 请求里出现这些词时改用严格档字体（strictFonts: true 时不必写）
        strictKeywords:
          - '严格公文格式'
          - '严格公文'
        # 字体自检：缺字体只提示、不阻断排版；下载安装必须由用户在当前对话里点头
        # （mode=fonts 拿到 consentRequired.token → 用户同意 → mode=installFonts, confirm=<token>）
        fontCheck:
          enabled: true
          autoInstall: 'ask'
        prompt:
          enabled: true
          order: 3260
        tool:
          enabled: true
        # 覆盖 docxfmt.py 的 DEFAULTS，例如：
        # defaults:
        #   linePt: 28
        #   signature:
        #     seal: true
