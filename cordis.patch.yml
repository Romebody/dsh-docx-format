# dsh-docx-format —— 公文格式规范化
# 安装方式（把 <PLUGIN_DIR> 换成插件所在目录）：
#   1) profile 的 package.json dependencies 加 "dsh-docx-format": "link:<PLUGIN_DIR>"
#      （已发布到 npm 时直接写版本号，如 "dsh-docx-format": "^1.0.0"）
#   2) dsh.profile.bundles 追加 "dsh-docx-format"
#   3) 重启 dsh
- insert:
    - id: docx-format
      name: 'dsh-docx-format'
      config:
        # 自动规范化：任何工具结果里出现 .docx 路径都会排队处理
        autoFormat: true
        # 只处理插件加载之后新写的文件；true 则连旧文件一起改（有备份需求时改这个）
        formatExisting: false
        debounceMs: 1200
        timeoutMs: 120000
        # 显式指定 python；留空则自动找 .dsh 自带运行时
        python: ''
        skipPatterns:
          - '*格式要求*'
          - '*模板*'
          - '~$*'
          - '*/node_modules/*'
        # 触发词：会话最后一条用户消息含其中之一 → 套完整公文版式
        # 例：用户说“按公文格式写份通知” → 生效；只说“写份周报” → 只做全局规范化
        # 置成空数组 [] 表示任何请求都套完整版式
        triggerKeywords:
          - '公文'
        # 没命中触发词时仍做全局规范化：分页六项全关、中文引号换“”、中文里英文前后不留空格
        # 置成 false 则彻底不碰文件（旧行为）
        globalNormalize: true
        # 字体档的持久真源只有一个：下面「严格公文格式」组件行的启用态。
        # 这里不再有 strictFonts 开关（v1.3.2 删除；旧配置写了 true 会在启动时自动迁移成组件行启用态）。
        # 请求里出现这些词时，只在本会话内临时切严格档：不切组件行、不写配置，重启或换会话即恢复普通档。
        strictKeywords:
          - '严格公文格式'
          - '严格公文'
        # 字体自检：缺字体只提示、不阻断排版；下载安装必须由用户在当前对话里点头
        # （mode=fonts 拿到 consentRequired.token → 用户同意 → mode=installFonts, confirm=<token>）
        fontCheck:
          enabled: true
          autoInstall: 'ask'
        prompt:
          enabled: true
          order: 3260
        tool:
          enabled: true
        # 覆盖 docxfmt.py 的 DEFAULTS，例如：
        # defaults:
        #   # 纸张：'A4'（默认，规范要求）或 'keep'（保留源文档原纸张）
        #   pageSize: 'A4'
        #   linePt: 28
        #   # 文本级规范开关（v1.3.3），全部默认开；不需要哪条就置 false
        #   normalize:
        #     charSpacing: true      # 字符间距「标准」
        #     timeColon: true        # 时间冒号半角（9：30 → 9:30）
        #     numberHalfDot: true    # 小数点全角点 → 半角（1．5 → 1.5）
        #     attachTagColon: true   # 末尾「附件1：」去掉冒号
        #     dateFormat: true       # 单独成段的日期统一成 2024年10月27日
        #     paginationOff: true    # 分页六项全关
        #     quotePair: true        # 「」→ “”
        #     cjkLatinSpace: true    # 中文里英文前后不留空格
        #   signature:
        #     seal: true
    # 「严格公文格式」组件行：插件页「包含的组件」里自有的一行，行尾那颗开关就是严格档总开关。
    # 它同时是严格档的**持久真源**：开关打开 = Loader 里这条 insert 启用 = 一律严格档。
    # 要长期关掉严格档，也可以在这里写 disabled: true（等于把那颗开关锁死在关闭）。
    # 必须指向独立包 dsh-docx-format-strict —— 组件行的标题/描述取自被引用包的 locale/{zh,en}.json
    # 的 meta.*，与主插件共用一份 locale 会把两行写成同一个标题。
    - id: docx-format-strict
      name: 'dsh-docx-format-strict'
